<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QR Generator | Colliers</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#0b2a62;
      --muted:#6b6b6b;
      --bg:#ffffff;
      --card:#ffffff;
      --radius:10px;
      --container-width:920px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Open Sans',system-ui,Arial,sans-serif;
      background:#fbfcfd;
      color:#111;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* small top brand bar (optional) */
    .brandbar{
      height:56px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 18px;
      background:var(--bg);
      border-bottom:1px solid rgba(11,42,98,0.06);
    }

    .brand-left{display:flex; align-items:center; gap:12px}
    .logo{height:36px; width:auto; display:block}
    .brand-title{font-weight:600; color:var(--brand); font-size:14px}

    /* center container */
    .wrap{
      min-height:calc(100vh - 56px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px;
    }

    /* main card */
    .card{
      width:100%;
      max-width:var(--container-width);
      background:var(--card);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:0 10px 30px rgba(12,34,78,0.06);
      border:1px solid rgba(11,42,98,0.04);
    }

    .card-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px}
    .title{font-weight:700; color:var(--brand); font-size:18px}
    .subtitle{color:var(--muted); font-size:13px}

    /* controls */
    .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .controls input[type="text"]{
      padding:10px 12px; border-radius:8px; border:1px solid #e7e7e7; min-width:320px; font-size:14px;
      outline:none;
    }
    .controls select{padding:10px 12px; border-radius:8px; border:1px solid #e7e7e7; background:#fff}
    .btn{padding:10px 14px; border-radius:8px; border:0; cursor:pointer; font-weight:600}
    .btn-primary{background:var(--brand); color:#fff}
    .btn-ghost{background:transparent; border:1px solid rgba(11,42,98,0.08); color:var(--brand)}

    /* preview area */
    .preview{
      display:flex;
      gap:18px;
      margin-top:18px;
      flex-wrap:wrap;
      align-items:flex-start;
    }
    .preview .box{
      width:260px;
      min-height:260px;
      border:1px solid #f0f0f0;
      background:#fff;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
    }
    .preview .label{font-size:13px; font-weight:600; margin-bottom:8px; color:var(--brand)}

    .note{margin-top:12px; color:var(--muted); font-size:13px}

    /* small screens */
    @media (max-width:720px){
      .controls input[type="text"]{min-width:180px; width:100%}
      .preview{justify-content:center}
      .brand-title{display:none}
    }
  </style>
</head>
<body>
  <!-- minimal brand bar -->
  <div class="brandbar" role="banner">
    <div class="brand-left">
      <!-- Logo: ensure this file exists at logo.svg (case-sensitive) -->
      <img id="brandLogo" src="logo.svg" alt="Company logo" class="logo"
           onerror="this.style.display='none'; document.getElementById('brandFallback').style.display='inline-block'">
      <!-- fallback text if logo asset missing -->
      <span id="brandFallback" style="display:none; font-weight:700; color:var(--brand);">Colliers India</span>
      <div class="brand-title">  | Internal Tools</div>
    </div>
    <div style="margin-left:auto; color:var(--muted); font-size:13px">QR Code Generator</div>
  </div>

  <!-- main -->
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="page-title">
      <div class="card-head">
        <div>
          <div id="page-title" class="title">QR Code Generator</div>
          <div class="subtitle">Generate SVG and PNG QR codes quickly</div>
        </div>

        <div style="display:flex; gap:8px; align-items:center;">
          <button id="download-png" class="btn btn-ghost" disabled>Download PNG</button>
          <button id="download-svg" class="btn btn-ghost" disabled>Download SVG</button>
        </div>
      </div>

      <div class="controls" aria-label="QR controls">
        <input id="text" type="text" placeholder="Enter text or URL" value="https://example.com" aria-label="Text to encode" />
        <select id="ec" aria-label="Error correction level" title="Error correction">
          <option value="L">EC: L (Low)</option>
          <option value="M" selected>EC: M (Medium)</option>
          <option value="Q">EC: Q (Quartile)</option>
          <option value="H">EC: H (High)</option>
        </select>

        <select id="size" aria-label="Size">
          <option value="256">256</option>
          <option value="384">384</option>
          <option value="512" selected>512</option>
        </select>

        <button id="gen" class="btn btn-primary">Generate</button>

        <button id="download-png-hi" class="btn btn-ghost" disabled title="High resolution PNG">PNG (Hi-Res)</button>
      </div>

      <div class="preview" aria-live="polite">
        <div>
          <div class="label">SVG Preview</div>
          <div id="svg-holder" class="box">No preview</div>
        </div>

        <div>
          <div class="label">PNG Preview</div>
          <div id="png-holder" class="box">
            <img id="png-img" alt="PNG preview" style="max-width:100%; max-height:100%; display:none" />
          </div>
        </div>
      </div>

      <div class="note">Tip: use EC Q/H if you will overlay a small logo at center.</div>
       <div class="note">Copyright © 2025 Colliers India - Ativir</div>
    </div>
  </div>

  <!-- QR library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    const genBtn = document.getElementById('gen');
    const downloadPngBtn = document.getElementById('download-png');
    const downloadSvgBtn = document.getElementById('download-svg');
    const downloadPngHiBtn = document.getElementById('download-png-hi');

    const svgHolder = document.getElementById('svg-holder');
    const pngImg = document.getElementById('png-img');

    let last = { svg: null, pngDataUrl: null };

    function setDisabledAll(v){
      downloadPngBtn.disabled = v;
      downloadSvgBtn.disabled = v;
      downloadPngHiBtn.disabled = v;
    }

    genBtn.addEventListener('click', () => {
      const text = document.getElementById('text').value.trim();
      if(!text) return alert('Enter text or URL');

      const ec = document.getElementById('ec').value;
      const size = parseInt(document.getElementById('size').value,10) || 512;

      setDisabledAll(true);
      svgHolder.innerHTML = 'Generating...';
      pngImg.style.display = 'none';
      pngImg.src = '';

      QRCode.toString(text, { type:'svg', errorCorrectionLevel:ec, width:size }, (err, svgString) => {
        if(err){ svgHolder.textContent='Error'; console.error(err); return; }
        svgHolder.innerHTML = svgString;
        last.svg = svgString;

        QRCode.toDataURL(text, { errorCorrectionLevel:ec, width:size, margin:1 }, (err2, dataUrl) => {
          if(err2){ console.error(err2); svgHolder.textContent='Error'; setDisabledAll(true); return; }
          last.pngDataUrl = dataUrl;
          pngImg.src = dataUrl;
          pngImg.style.display = 'block';
          setDisabledAll(false);
        });
      });
    });

    downloadSvgBtn.addEventListener('click', () => {
      if(!last.svg) return alert('Generate QR first');
      const blob = new Blob([last.svg], { type:'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'qrcode.svg'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    });

    downloadPngBtn.addEventListener('click', () => {
      if(!last.pngDataUrl) return alert('Generate QR first');
      const a = document.createElement('a');
      a.href = last.pngDataUrl; a.download='qrcode.png'; document.body.appendChild(a); a.click(); a.remove();
    });

    downloadPngHiBtn.addEventListener('click', () => {
      const text = document.getElementById('text').value.trim();
      if(!text) return alert('Generate QR first');
      const ec = document.getElementById('ec').value;
      const hiSize = 2048;
      setDisabledAll(true); downloadPngHiBtn.textContent='Preparing...';
      QRCode.toDataURL(text, { errorCorrectionLevel:ec, width:hiSize, margin:1 }, (err, url) => {
        setDisabledAll(false); downloadPngHiBtn.textContent='PNG (Hi-Res)';
        if(err){ console.error(err); return alert('Failed to create hi-res PNG'); }
        const a = document.createElement('a'); a.href=url; a.download='qrcode-hires.png'; document.body.appendChild(a); a.click(); a.remove();
      });
    });

    // enter to submit
    document.getElementById('text').addEventListener('keydown', (e)=>{ if(e.key==='Enter') genBtn.click(); });

    // initial
    setDisabledAll(true);
  </script>
</body>
</html>
